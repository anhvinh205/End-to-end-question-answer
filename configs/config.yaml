project:
  name: "google-nq-end-to-end-qa"
  version: "1.1.0"
  seed: 42

# --------------------------------------------------------------------------- data
dataset:
  # Natural Questions CSV export (columns: question, long_answers, short_answers).
  # Use the *Base* file: the "Filtered" variant drops ~18% of the digits and corrupts names.
  csv_path: "data/raw/Natural-Questions-Base.csv"
  processed_dir: "data/processed"
  sample_path: "data/sample/nq_sample.jsonl" # tiny bundled corpus used for the offline demo
  # passage filters
  context_types: ["P", "Ul", "Ol", "Li", "Dl", "Dd"] # HTML element of the long answer; tables are skipped
  min_context_words: 10
  max_context_words: 350
  max_answer_words: 20
  keep_unanswered: true # long answer without short answer -> natural negative example
  # group-aware split (by passage hash, so a paragraph never lands in two splits)
  val_ratio: 0.05
  test_ratio: 0.05
  # reader training
  max_train_samples: 20000
  max_val_samples: 2000
  max_length: 384
  stride: 128
  negative_sampling_ratio: 0.3 # share of negative (no-answer) examples in the training set
  hf_dataset: "google-research-datasets/natural_questions" # optional raw streaming route

# ------------------------------------------------------------------------- index
index:
  corpus_size: 20000 # passages in the knowledge base: val + test gold passages + train distractors

# ---------------------------------------------------------------------- retriever
retriever:
  mode: "hybrid" # query-time: bm25 | dense | hybrid (dense + BM25 fused with RRF)
  dense_encoder: "biencoder" # build-time: biencoder (mean pooling) | cls (vanilla DistilBERT baseline)
  cls_model_name: "distilbert-base-uncased"
  biencoder_model_name: "sentence-transformers/multi-qa-MiniLM-L6-cos-v1"
  max_passage_tokens: 256
  index_type: "FlatIP" # FlatIP | FlatL2 | IVFFlat
  nlist: 256 # IVFFlat only
  nprobe: 8 # IVFFlat only
  index_path: "artifacts/faiss/nq_index.faiss"
  metadata_path: "artifacts/faiss/nq_passages.parquet"
  top_k: 5
  candidate_pool: 50 # depth taken from each ranker before fusion
  rrf_k: 60
  alpha_reader_weight: 0.7 # S = alpha * P_reader + (1 - alpha) * S_retriever(normalised)

# ------------------------------------------------------------------------- reader
reader:
  base_model: "distilbert-base-uncased" # starting point for fine-tuning on NQ
  pretrained_checkpoint: "distilbert-base-uncased-distilled-squad" # used until a fine-tuned model exists
  output_dir: "artifacts/models/distilbert-finetuned-nq"
  use_finetuned_if_available: true
  abstain: true # honour the tuned null threshold (only exists for NQ fine-tuned checkpoints)
  learning_rate: 3.0e-5
  num_train_epochs: 2
  per_device_train_batch_size: 16
  gradient_accumulation_steps: 1
  warmup_ratio: 0.1
  weight_decay: 0.01
  fp16: true # applied only when CUDA is available
  n_best_size: 20
  max_answer_length: 30 # in word pieces
  inference_batch_size: 16

# ---------------------------------------------------------------------- evaluation
evaluation:
  split: "validation"
  num_queries: 1000
  ks: [1, 5, 10, 20]
  e2e_top_k: 5
  report_dir: "reports"

server:
  api_host: "0.0.0.0"
  api_port: 8000
  streamlit_port: 8501
