[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nq-qa"
version = "1.1.0"
description = "End-to-end open-domain question answering on Google Natural Questions: hybrid retrieval (FAISS + BM25 + RRF) and an extractive Transformer reader."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["question-answering", "retrieval", "faiss", "bm25", "transformers", "natural-questions", "nlp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1",
    "transformers>=4.46,<6",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "pyyaml>=6.0.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.28",
    "pydantic>=2.6",
    "httpx>=0.27",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Fine-tuning the reader (Arrow-backed datasets keep tokenised features out of RAM).
train = ["datasets>=2.18", "accelerate>=0.27"]
# Streamlit demo + PDF question answering.
ui = ["streamlit>=1.32", "pypdf>=4.1"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "rank-bm25>=0.2.2",   # only used to cross-check our own BM25 implementation in tests
]
all = ["nq-qa[train,ui,dev]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts", "app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # line length is enforced by the formatter
    "RUF001", "RUF002", "RUF003",  # intentional typographic characters in docs/UI strings
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests that train a (tiny) model and take several seconds",
    "network: tests that need to download weights from the Hugging Face Hub",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]

[tool.coverage.run]
source = ["src/nq_qa"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise NotImplementedError"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
files = ["src/nq_qa"]
